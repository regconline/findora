<!-- Supabase → Authentication → Email Templates → "Reset password". Subject: Reset your Findora password -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F7F8;padding:32px 12px;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;color:#172B36">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border:1px solid #E5EAED;border-radius:14px">
      <tr><td style="padding:28px 32px 8px"><img src="{{ .SiteURL }}/brand/findora-logo.png" width="150" alt="Findora" style="display:block;height:auto;border:0"></td></tr>
      <tr><td style="padding:8px 32px 28px">
        <h1 style="margin:16px 0 12px;font-size:22px;color:#102C3B">Reset your password</h1>
        <p style="font-size:15px;line-height:1.65;margin:0 0 14px">We received a request to reset the password for your Findora account. This link expires soon and can only be used once.</p>
        <p style="margin:24px 0"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password" style="display:inline-block;background:#20B88A;color:#FFFFFF;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:10px;font-size:15px">Choose a new password</a></p>
        <p style="font-size:13px;line-height:1.6;color:#687780;margin:0">If you didn't request this, you can ignore this email — your password won't change.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
